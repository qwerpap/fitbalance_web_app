services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fitbalance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitbalance
      POSTGRES_USER: danil
      POSTGRES_PASSWORD: fitbalance_password  # Пароль для Docker PostgreSQL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danil -d fitbalance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fitbalance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fitbalance-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fitbalance
      RABBITMQ_DEFAULT_PASS: fitbalance
    ports:
      - "5672:5672"   # AMQP порт для приложения
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

