<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Auth Test - FitBalance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .google-btn {
            width: 100%;
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        
        .google-btn:hover {
            background: #357ae8;
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 2px;
            padding: 2px;
        }
        
        .user-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .user-info.show {
            display: block;
        }
        
        .user-info h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .info-item {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        
        .info-label {
            font-weight: bold;
            color: #667eea;
            margin-right: 10px;
        }
        
        .logout-btn {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: #c82333;
        }
        
        .loading {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ FitBalance</h1>
        <p>Войдите через Google для доступа к приложению</p>
        
        <button class="google-btn" id="googleBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Войти через Google
        </button>
        
        <div class="user-info" id="userInfo">
            <h2>✅ Успешно авторизованы</h2>
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span id="userEmail"></span>
            </div>
            <div class="info-item">
                <span class="info-label">ID:</span>
                <span id="userId"></span>
            </div>
            <div class="info-item">
                <span class="info-label">Роль:</span>
                <span id="userRole"></span>
            </div>
            <div class="info-item">
                <span class="info-label">JWT Token:</span>
                <span id="userToken" style="word-break: break-all; font-size: 12px;"></span>
            </div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
        
        <div class="loading" id="loading" style="display: none;">
            Обработка авторизации...
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8080';
        
        // При загрузке страницы проверяем callback
        window.addEventListener('DOMContentLoaded', async () => {
            // Проверяем, есть ли сохраненный токен СНАЧАЛА
            const savedToken = localStorage.getItem('authToken');
            
            // Если это callback от Google
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                // Если уже есть валидный токен, просто редиректим на чистый URL
                if (savedToken) {
                    console.log('У нас уже есть токен, редиректим на чистый URL');
                    window.location.href = window.location.pathname;
                    return;
                }
                
                // Проверяем, не обрабатывали ли мы уже этот код
                const processedCode = sessionStorage.getItem('processedCode');
                if (processedCode === code) {
                    console.log('Код уже обработан, редиректим');
                    window.location.href = window.location.pathname;
                    return;
                }
                
                // Если код уже использован (получили ошибку), просто редиректим
                if (sessionStorage.getItem('codeUsed') === code) {
                    console.log('Код уже использован, редиректим');
                    window.location.href = window.location.pathname;
                    return;
                }
                
                // Показываем индикатор загрузки
                document.getElementById('loading').style.display = 'block';
                document.getElementById('googleBtn').style.display = 'none';
                
                try {
                    // Помечаем код как обрабатываемый
                    sessionStorage.setItem('processedCode', code);
                    
                    // Обмениваем code на токен
                    const response = await fetch(`${API_URL}/auth/google/callback?code=${encodeURIComponent(code)}`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('Получен токен:', data);
                        
                        // Сохраняем токен в localStorage
                        localStorage.setItem('authToken', data.token);
                        console.log('Токен сохранен в localStorage');
                        
                        // Проверяем, что токен действительно сохранился
                        const savedToken = localStorage.getItem('authToken');
                        console.log('Проверка сохраненного токена:', savedToken ? 'OK' : 'FAILED');
                        
                        // Скрываем индикатор загрузки
                        document.getElementById('loading').style.display = 'none';
                        
                        // Показываем информацию о пользователе
                        showUserInfo(data.user, data.token);
                        
                        // Убираем код из sessionStorage
                        sessionStorage.removeItem('processedCode');
                        
                        // Очищаем URL от code без перезагрузки страницы
                        const cleanUrl = window.location.origin + window.location.pathname;
                        window.history.replaceState({}, document.title, cleanUrl);
                        console.log('URL очищен от code');
                    } else {
                        const errorText = await response.text();
                        console.error('Ошибка авторизации:', errorText);
                        
                        // Если код уже использован, проверяем, есть ли токен от предыдущей авторизации
                        if (errorText.includes('already used')) {
                            sessionStorage.setItem('codeUsed', code);
                            
                            // Проверяем, есть ли токен от предыдущей успешной авторизации
                            const existingToken = localStorage.getItem('authToken');
                            if (existingToken) {
                                console.log('Найден существующий токен, проверяем его валидность...');
                                try {
                                    const userResponse = await fetch(`${API_URL}/auth/me`, {
                                        headers: {
                                            'Authorization': `Bearer ${existingToken}`
                                        }
                                    });
                                    
                                    if (userResponse.ok) {
                                        const user = await userResponse.json();
                                        console.log('Токен валиден, показываем данные пользователя');
                                        showUserInfo(user, existingToken);
                                        window.location.href = window.location.pathname;
                                        return;
                                    }
                                } catch (e) {
                                    console.log('Токен невалиден, удаляем его');
                                    localStorage.removeItem('authToken');
                                }
                            }
                        }
                        
                        // Убираем код из sessionStorage
                        sessionStorage.removeItem('processedCode');
                        // Очищаем URL и показываем кнопку входа
                        window.location.href = window.location.pathname;
                    }
                } catch (error) {
                    console.error('Ошибка при обработке авторизации:', error);
                    // Убираем код из sessionStorage
                    sessionStorage.removeItem('processedCode');
                    // Редиректим на чистый URL
                    window.location.href = window.location.pathname;
                }
                return;
            }
            
            // Если нет code в URL, проверяем сохраненный токен
            if (savedToken) {
                await loadUserInfo(savedToken);
            }
        });
        
        // Кнопка "Войти через Google"
        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_URL}/auth/google/url`);
                const data = await response.json();
                window.location.href = data.url;
            } catch (error) {
                alert('Ошибка при получении URL авторизации: ' + error.message);
            }
        });
        
        // Загрузка информации о пользователе
        async function loadUserInfo(token) {
            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    showUserInfo(user, token);
                } else {
                    // Токен невалидный или истек
                    console.log('Токен невалидный, удаляем из localStorage');
                    localStorage.removeItem('authToken');
                    document.getElementById('googleBtn').style.display = 'block';
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователя:', error);
                localStorage.removeItem('authToken');
                document.getElementById('googleBtn').style.display = 'block';
            }
        }
        
        // Отображение информации о пользователе
        function showUserInfo(user, token) {
            document.getElementById('googleBtn').style.display = 'none';
            document.getElementById('userInfo').classList.add('show');
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userId').textContent = user.id;
            document.getElementById('userRole').textContent = user.role;
            document.getElementById('userToken').textContent = token;
            
            localStorage.setItem('authToken', token);
        }
        
        // Кнопка "Выйти"
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            sessionStorage.clear();
            location.reload();
        });
    </script>
</body>
</html>
