<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐰 RabbitMQ Queue Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status-connected {
            background: #4CAF50;
            color: white;
        }
        
        .status-disconnected {
            background: #f44336;
            color: white;
        }
        
        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .controls h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .btn-calculation {
            background: #667eea;
            color: white;
        }
        
        .btn-notification {
            background: #f093fb;
            color: white;
        }
        
        .btn-email {
            background: #4facfe;
            color: white;
        }
        
        .btn-stress {
            background: #fa709a;
            color: white;
        }
        
        .btn-refresh {
            background: #43e97b;
            color: white;
        }
        
        .log-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .log-container h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .log {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .log-success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .log-info {
            background: #e3f2fd;
            color: #1565c0;
        }
        
        .log-warning {
            background: #fff3e0;
            color: #e65100;
        }
        
        .log-error {
            background: #ffebee;
            color: #c62828;
        }
        
        .links {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .links a:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐰 RabbitMQ Queue Demo</h1>
        
        <!-- Статистика -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>🧮 Расчеты</h3>
                <div class="stat-value" id="calculations">0</div>
                <div class="stat-label">в очереди</div>
            </div>
            
            <div class="stat-card">
                <h3>🔔 Уведомления</h3>
                <div class="stat-value" id="notifications">0</div>
                <div class="stat-label">в очереди</div>
            </div>
            
            <div class="stat-card">
                <h3>✉️ Email</h3>
                <div class="stat-value" id="emails">0</div>
                <div class="stat-label">в очереди</div>
            </div>
            
            <div class="stat-card">
                <h3>📊 Статус</h3>
                <div id="status-badge" class="status-badge status-disconnected">Проверка...</div>
                <div class="stat-label" id="last-update">Обновляется...</div>
            </div>
        </div>
        
        <!-- Управление -->
        <div class="controls">
            <h2>🎮 Отправка сообщений</h2>
            <div class="button-grid">
                <button class="btn-calculation" onclick="sendCalculation()">
                    📊 Отправить расчет
                </button>
                <button class="btn-notification" onclick="sendNotification()">
                    🔔 Отправить уведомление
                </button>
                <button class="btn-email" onclick="sendEmail()">
                    ✉️ Отправить Email
                </button>
                <button class="btn-stress" onclick="stressTest()">
                    🚀 Нагрузочный тест (10 задач)
                </button>
                <button class="btn-refresh" onclick="updateStats()">
                    🔄 Обновить статистику
                </button>
            </div>
        </div>
        
        <!-- Лог -->
        <div class="log-container">
            <h2>📝 Лог активности</h2>
            <div class="log" id="log"></div>
        </div>
        
        <!-- Ссылки -->
        <div class="links">
            <a href="http://localhost:15672" target="_blank">🌐 RabbitMQ Management UI</a>
            <a href="/static/dashboard.html">📊 Dashboard</a>
        </div>
    </div>
    
    <script>
        let messageCount = 0;
        
        // Обновление статистики
        async function updateStats() {
            try {
                const response = await fetch('/queue/stats');
                const data = await response.json();
                
                document.getElementById('calculations').textContent = data.calculations;
                document.getElementById('notifications').textContent = data.notifications;
                document.getElementById('emails').textContent = data.emails;
                
                const badge = document.getElementById('status-badge');
                if (data.status === 'connected') {
                    badge.textContent = '✅ Подключено';
                    badge.className = 'status-badge status-connected';
                } else {
                    badge.textContent = '❌ Отключено';
                    badge.className = 'status-badge status-disconnected';
                }
                
                const now = new Date().toLocaleTimeString('ru-RU');
                document.getElementById('last-update').textContent = `Обновлено: ${now}`;
                
                addLog('info', 'Статистика обновлена');
            } catch (error) {
                addLog('error', `Ошибка обновления статистики: ${error.message}`);
            }
        }
        
        // Отправка расчета
        async function sendCalculation() {
            messageCount++;
            const data = {
                userId: `user-${messageCount}`,
                weight: 70 + Math.random() * 20,
                height: 170 + Math.random() * 20,
                age: 20 + Math.floor(Math.random() * 30),
                gender: Math.random() > 0.5 ? 'male' : 'female',
                activityLevel: ['sedentary', 'moderate', 'active'][Math.floor(Math.random() * 3)],
                goal: ['lose', 'maintain', 'gain'][Math.floor(Math.random() * 3)]
            };
            
            try {
                const response = await fetch('/queue/calculation', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                addLog('success', `📊 Расчет отправлен для ${data.userId}`);
                setTimeout(updateStats, 500);
            } catch (error) {
                addLog('error', `Ошибка отправки расчета: ${error.message}`);
            }
        }
        
        // Отправка уведомления
        async function sendNotification() {
            messageCount++;
            const types = ['success', 'info', 'warning', 'error'];
            const titles = ['Успех!', 'Информация', 'Внимание!', 'Ошибка'];
            const messages = ['Операция выполнена', 'Новое сообщение', 'Проверьте данные', 'Что-то пошло не так'];
            const idx = Math.floor(Math.random() * 4);
            
            const data = {
                userId: `user-${messageCount}`,
                title: titles[idx],
                message: messages[idx],
                type: types[idx]
            };
            
            try {
                const response = await fetch('/queue/notification', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                addLog('success', `🔔 Уведомление "${data.title}" отправлено`);
                setTimeout(updateStats, 500);
            } catch (error) {
                addLog('error', `Ошибка отправки уведомления: ${error.message}`);
            }
        }
        
        // Отправка email
        async function sendEmail() {
            messageCount++;
            const data = {
                to: `user${messageCount}@example.com`,
                subject: 'Результаты готовы',
                body: `Ваши результаты расчета #${messageCount} готовы к просмотру`
            };
            
            try {
                const response = await fetch('/queue/email', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                addLog('success', `✉️ Email отправлен на ${data.to}`);
                setTimeout(updateStats, 500);
            } catch (error) {
                addLog('error', `Ошибка отправки email: ${error.message}`);
            }
        }
        
        // Нагрузочный тест
        async function stressTest() {
            addLog('warning', '🚀 Начат нагрузочный тест: отправка 10 задач...');
            
            const promises = [];
            for (let i = 0; i < 10; i++) {
                promises.push(sendCalculation());
            }
            
            await Promise.all(promises);
            addLog('success', '✅ Нагрузочный тест завершен!');
            setTimeout(updateStats, 1000);
        }
        
        // Добавление записи в лог
        function addLog(type, message) {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString('ru-RU');
            entry.textContent = `[${time}] ${message}`;
            log.insertBefore(entry, log.firstChild);
            
            // Ограничиваем количество записей
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }
        
        // Автообновление каждые 2 секунды
        setInterval(updateStats, 2000);
        
        // Первое обновление при загрузке
        updateStats();
        addLog('info', '🚀 Демо страница загружена');
    </script>
</body>
</html>
